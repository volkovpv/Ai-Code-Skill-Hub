# Vendor adapter for xAI models.
# Interface wiring only: a skill's rules live in SKILL.md and are the same
# for every vendor, so nothing normative may appear here. The file name must
# match a vendor declared in vendors.yaml.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt
# is one line.
interface:
  display_name: TypeScript + NestJS
  short_description: NestJS-specific conventions for hexagonal services - tokens, providers, HTTP boundary, config, testing.
  default_prompt: "Apply the typescript-nestjs skill: NestJS-specific rules for services built on the hexagonal architecture. Activate it when writing, reviewing, or refactoring NestJS code - modules, providers, controllers, pipes, guards, interceptors, exception filters, config namespaces, or NestJS tests. Enforce named unique-symbol DI tokens (never string or inline-Symbol tokens), plain use-case classes assembled by factory providers, controllers as pure mappers behind a global ValidationPipe, exception filters that log once and map domain errors to HTTP once with masked 5xx, fail-closed env validation behind @nestjs/config, and @nestjs/testing with overrideProvider at the token. Where the host project also declares an architecture or a language standard, apply that on top of this skill; do not force this skill onto non-NestJS requests. Project instructions always take precedence over the skill."
