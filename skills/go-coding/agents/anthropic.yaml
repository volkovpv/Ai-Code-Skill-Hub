# Vendor adapter for Anthropic models.
# Interface wiring only: a skill's rules live in SKILL.md and are the same
# for every vendor, so nothing normative may appear here. The file name must
# match a vendor declared in vendors.yaml.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt
# is one line.
interface:
  display_name: Go Coding (universal)
  short_description: Universal Go 1.27 coding standard - explicit error handling, owned goroutines, secure by default, lint-clean - free of framework and architecture assumptions.
  default_prompt: "Apply the go-coding skill: a universal Go coding standard for a Go 1.27 floor with no framework, architecture, or library assumptions. Activate it when writing, reviewing, or refactoring any Go code - .go files, go.mod, and _test.go tests. Enforce gofmt layout and Go naming, every error handled exactly once (wrapped with %w and context, inspected with errors.Is and errors.AsType, never matched by message, never panicked, never logged and returned), literal nil for interface results, small consumer-owned interfaces with concrete return types, typed constants with exhaustive switches plus a failing default, sealed interfaces for variants, named id types parsed at the boundary, context.Context as the first parameter and never stored in a struct, goroutines with an owner, a stop signal and a waiter (errgroup, sync.WaitGroup.Go) and bounded fan-out, no data races (named mutex fields, pointer receivers, go test -race), secure-by-default code (SQL placeholders, exec.CommandContext without a shell, os.Root for input paths, crypto/rand tokens, constant-time secret comparison, TLS verification never disabled, http.Server and http.Client with timeouts, bounded input), unit-typed durations, integer money, capped or cloned subslices before append, resources closed on every path with write-side Close errors joined, environment read once into a typed config, log/slog through an injected logger, no init or mutable package state, modern Go 1.27 forms (any, slices, maps, errors.AsType, wg.Go, b.Loop) with go fix, a golangci-lint v2 configuration passed with zero issues and no blanket nolint, a search by shape before writing new code, and optimization only against a benchmark. Do not apply architecture- or framework-specific rules - they are out of this skill's scope - and do not force the skill onto non-Go requests. Project instructions always take precedence over the skill."
