# Vendor-specific adapter for OpenAI harnesses (Codex).
# Other harnesses ignore this file; keep SKILL.md vendor-neutral.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt is one line.
interface:
  display_name: Testing Discipline (universal)
  short_description: Universal rules for writing and reviewing tests, free of language, runner, framework and platform assumptions; the unit-testing school is declared by the project.
  default_prompt: "Apply the testing-discipline skill: a universal standard for writing and reviewing tests, with no language, runner, framework or platform assumptions. Activate it whenever tests are written, reviewed or reworked, in any language. It is also neutral on the unit-testing school: whether isolation means isolating the unit from its collaborators (London, mockist) or isolating the tests from one another (classical, Detroit) is declared by the host project's rules, and that choice decides which collaborators get a test double, what a unit is and what counts as an integration test - follow the declared school, or where none is declared follow the existing suite and propose recording the choice; never guess and never mix the two by accident. Enforce that a code change ships with its tests and every bug fix ships a regression test that fails before the fix; Arrange/Act/Assert with one scenario and one act step per test, no branching, and names stating the behaviour and the condition as a fact; assertions that pin the expected error together with its condition; a test judged on all four attributes at once - protection against bugs, resistance to refactoring, feedback speed, maintenance cost - with resistance to refactoring never traded away; assertions on observable behaviour and never on an implementation detail, with no member widened for a test; output verification preferred to state verification and state verification to asserting an interaction, and an interaction asserted only where it crosses the application boundary, at the last seam before the call leaves the process, in both directions; unit tests that touch nothing external, with time injected as a value rather than slept through or reached through an ambient global, and every awaited assertion under a deadline; fakes bound to the seams the code exposes, only for types you own, never to someone else's internals, with patching as a justified last resort and no assertion ever made on a stub; a fake standing in for a system the project does not own whose contract is pinned by a live observation of that system, never by re-reading a norm, an RFC or vendor documentation; construction and outbound-substitution properties exercised through the production factory or entry point rather than a hand-built copy; case sets, subjects and dimensions derived from the specification rather than from the artifact under test, never recomputing the expected value with the algorithm under test, treating a surviving mutation as a missing dimension and a healthy mutation score as no evidence of specification coverage; black-box testing with coverage used to find untested areas rather than as a target, no test for trivial code and no bad test kept; and suite hygiene - no committed focus or skip markers, no test tuned to the gate, deterministic runs, test-only secrets, no production code that exists only for tests. Do not add language spellings, runner mechanics or architecture rules (they belong to the language standards and to the hexagonal-service skill), do not pick the school yourself, and do not force the skill onto requests that are not about tests. Project instructions always take precedence over the skill."
