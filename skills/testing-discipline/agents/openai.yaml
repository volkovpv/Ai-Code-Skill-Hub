# Vendor-specific adapter for OpenAI harnesses (Codex).
# Other harnesses ignore this file; keep SKILL.md vendor-neutral.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt is one line.
interface:
  display_name: Testing Discipline (universal)
  short_description: Universal rules for writing and reviewing tests, free of language, runner, framework and platform assumptions.
  default_prompt: "Apply the testing-discipline skill: a universal standard for writing and reviewing tests, with no language, runner, framework or platform assumptions. Activate it whenever tests are written, reviewed or reworked, in any language. Enforce that a code change ships with its tests and every bug fix ships a regression test that fails before the fix; Arrange/Act/Assert with one scenario per test and names stating the behaviour and the condition; assertions that pin the expected error together with its condition; unit tests that touch nothing external, with time injected rather than slept through and every awaited assertion under a deadline; fakes bound to the seams the code exposes and never to someone else's internals, with patching as a justified last resort; a fake standing in for a system the project does not own whose contract is pinned by a live observation of that system, never by re-reading a norm, an RFC or vendor documentation; construction and outbound-substitution properties exercised through the production factory or entry point rather than a hand-built copy; case sets, subjects and dimensions derived from the specification rather than from the artifact under test, treating a surviving mutation as a missing dimension and a healthy mutation score as no evidence of specification coverage; and suite hygiene - no committed focus or skip markers, no test tuned to the gate, deterministic runs, test-only secrets. Do not add language spellings, runner mechanics or architecture rules (they belong to the language standards and to the hexagonal-service skill), and do not force the skill onto requests that are not about tests. Project instructions always take precedence over the skill."
