# Vendor adapter for OpenAI models.
# Interface wiring only: a skill's rules live in SKILL.md and are the same
# for every vendor, so nothing normative may appear here. The file name must
# match a vendor declared in vendors.yaml.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt
# is one line.
interface:
  display_name: Testing Discipline (unit and integration)
  short_description: Discipline for unit and integration tests, free of language, runner, framework and platform assumptions; the unit-testing school is declared by the project.
  default_prompt: "Apply the testing-discipline skill: a standard for writing and reviewing unit and integration tests, with no language, runner, framework or platform assumptions. Activate it whenever unit or integration tests are written, reviewed or reworked, in any language. Its scope is unit and integration tests and nothing else: testing a whole deployed system from outside it - its packaging, its environment, its release process, its users - is a different discipline with different subjects and owners, so when a request is about that, say the skill does not cover it rather than answering from these rules. It is neutral on the unit-testing school: whether isolation means isolating the unit from its collaborators (London, mockist) or isolating the tests from one another (classical, Detroit) is declared by the host project's rules, and that choice decides which collaborators get a test double, what a unit is and where the line between a unit test and an integration test runs - follow the declared school, or where none is declared follow the existing suite and propose recording the choice; never guess and never mix the two by accident. Enforce that a code change ships with its tests and every bug fix ships a regression test that fails before the fix; that no test counts as protection until it has been observed to fail for its own reason, which is free when the test is written first and otherwise costs one deliberate break-and-restore of the behaviour it names, with an unexpected green investigated rather than enjoyed; that the failure message be read and made legible before the code that turns it green is written, the cycle having four steps (fail, report, pass, refactor) rather than three; that the level a test belongs to be chosen deliberately and kept, so that a unit test which acquires a real connection, file or clock is recognised as having changed level and is moved, renamed and given the lifecycle its level carries, with the position of that line taken from the project's declaration rather than assumed; Arrange/Act/Assert with one scenario and one act step per test, no branching, and names stating the behaviour and the condition as a fact; assertions that pin the expected error together with its condition and name the expected value rather than a property many wrong answers share, over data in which no constant means two things and whose expected value visibly follows from the specification's own rule written in the test's own literals; an arrange step built from builders or factories so a test states only the fields its scenario depends on and defaults the rest, with helpers that take a builder rather than its arguments; values that name the concept they stand for rather than writing its bare representation, and that describe their own role when they appear in a failure report; a test judged on all four attributes at once - protection against bugs, resistance to refactoring, feedback speed, maintenance cost - with resistance to refactoring never traded away; assertions on observable behaviour and never on an implementation detail, with no member widened for a test; output verification preferred to state verification and state verification to asserting an interaction, and an interaction asserted only where it crosses the application boundary, at the last seam before the call leaves the process, in both directions; interactions specified precisely and no more, being exact about the outcome the scenario drives and silent about everything it does not, with queries allowed any number of times, commands expected exactly as often as the contract says, required interactions kept few, arguments matched only as tightly as the scenario constrains them, and call order pinned only where the order is part of the contract; unit tests that touch nothing external, with time injected as a value rather than slept through or reached through an ambient global, and every awaited assertion under a deadline; fakes bound to the seams the code exposes, replacing peers and never internals, only for types you own, preferring a named role to a concrete type (doubling a class leaves the relationship between the two objects unnamed and binds the subject to far more of that class than it uses), distinguishing dependencies (required at construction, no safe default) from notifications and adjustments (defaulted and overridden per test), never to someone else's internals, with patching as a justified last resort and no assertion ever made on a stub; a fake standing in for a system the project does not own whose contract is pinned by a live observation of that system, never by re-reading a norm, an RFC or vendor documentation, written before the first use of an unfamiliar facility, re-run on every upgrade of it, and expressed as cases the fake and the real dependency can both answer; construction and outbound-substitution properties exercised through the production factory or entry point rather than a hand-built copy; case sets, subjects and dimensions derived from the specification rather than from the artifact under test, never recomputing the expected value with the algorithm under test, treating a surviving mutation as a missing dimension and a healthy mutation score as no evidence of specification coverage; black-box testing with coverage used to find untested areas rather than as a target, no test for trivial code, no test of a dependency's own behaviour, depth calibrated by the cost of being wrong, and a test deleted only when it is redundant both on confidence and on communication; a hard-to-write, slow or fragile test read as a report on the design and answered by changing the design first, with a dependency reachable only through a global read as a hidden dependency rather than an excuse to reach for tooling that intercepts it; asynchronous tests that wait for success and treat the timeout as the failure, never sleeping, never asserting a state the system could already have been in before it started - a wait whose condition already held at the starting state, such as a quantity returning to the value it began at, never waited for anything and passes against a system that did nothing, so the test first waits for a state the initial one could not have been in - keeping the timeout in one place, separating what an object computes from how it schedules, and pulling self-scheduled activity out to somewhere a test can drive it; generic mapping code exercised with purpose-built types rather than production domain types, persistent state cleaned at the start of a test rather than at the end, and transaction boundaries written into the test rather than replaced by a rollback that never exercises a commit; and suite hygiene - no committed focus or skip markers, with a test that is red only because its behaviour is not written yet kept in the working copy until it passes rather than silenced and committed, an expected-failure or pending marker being the same silence whatever tracking reference it carries; no test tuned to the gate, a refactor that changes no behaviour being unable to turn a test red, so that when one does the question is whether the change was more than a refactor or introduced a defect, settled before any expected value or snapshot moves, and a new expectation sanctioned by a real behaviour change derived from the specification rather than read back from what the code now produces; no flickering test tolerated, no red suite shared, deterministic runs, test-only secrets, no production code that exists only for tests, with reporting that operators depend on treated as a feature and test-driven through a seam you own while tracing you added for your own benefit is not. Where the project declares that it practises test-driven development, also drive the work through the cycle: never more than one red test at once, the shortest route to green (a deliberately constant implementation being a step in the cycle and not a tuned test), then removal of duplication including the duplication between the test and the code. Where the project declares the London school, also discover each collaborator from its client rather than extracting it from an implementation: the role is named from the point of view of the object that needs it before any implementation of it exists, the double in the test is what brings it into being, its surface is kept narrow, and roles that turn out to mean the same thing are merged rather than left to drift apart. Do not add language spellings, runner mechanics or architecture rules - they are out of this skill's scope - do not pick the school yourself, do not impose the cycle on a project that has not declared it, do not impose interface discovery on a project that has not declared London, and do not force the skill onto requests that are not about unit or integration tests. Project instructions always take precedence over the skill."
