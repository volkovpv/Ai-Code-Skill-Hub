# Vendor adapter for Google models.
# Interface wiring only: a skill's rules live in SKILL.md and are the same
# for every vendor, so nothing normative may appear here. The file name must
# match a vendor declared in vendors.yaml.
# Note: the in-house YAML subset has no multiline scalars, so default_prompt
# is one line.
interface:
  display_name: TypeScript Coding (universal)
  short_description: Universal strictly-typed TypeScript coding standard, free of framework and architecture assumptions.
  default_prompt: "Apply the typescript-coding skill: a universal TypeScript coding standard with no framework, architecture, or library assumptions. Activate it when writing, reviewing, or refactoring any .ts/.mts/.cts code. Enforce strict compiler flags, as-const registries instead of native enums, branded ids, readonly-by-default, unknown in catch with narrowing, no type or lint suppressions, and centralized process.env access. Design types first: discriminated unions with exhaustive never-checked switches, invalid states unrepresentable, satisfies for registries, validated (never asserted) boundary data, generics only where a type parameter relates two types. Do not apply architecture- or framework-specific rules - they are out of this skill's scope - and do not force the skill onto non-TypeScript requests. Project instructions always take precedence over the skill."
