# Catalog of the library's published skills.
# IMPORTANT: the `skills:` list must remain the last top-level key of this
# file — `skillctl new` appends new entries textually at the end.
version: 1
skills:
  - name: example-skill
    path: skills/example-skill
    version: 0.3.0
    status: stable
    summary: Reference skill; drafts a Conventional Commits message from a git diff.
    platforms: [universal, codex, opencode, claude, hermes]
    license: MIT
    capabilities:
      knowledge: true
      data: true
      observations: true
    content_policy:
      max_tracked_file_bytes: 262144
      pii_allowed: false
      secrets_allowed: false
      observation_review_required: true
  # The four skills below are stable on a measured gate bar, taken on
  # 2026-07-29 with scripts/run_skill_evals.py --tier gate --repeat 3
  # (vendor anthropic, claude-sonnet-5, effort medium) over
  # __test__/evals/<skill>/cases.json.
  # The bar is per-case majority — every case passes at least 2 of 3
  # attempts, not a clean sweep; the cases listed at 2/3 below are
  # run-to-run variance in wording, not missing rules. Aggregate over the
  # four skills: 226 of 231 attempts. Cases whose text was corrected during
  # that session were re-measured on the same tier afterwards. Re-measure
  # the same way after changing a skill or its cases.
  # typescript-coding: 23 cases (OBS-20260818-001 added 2, OBS-20260819-001
