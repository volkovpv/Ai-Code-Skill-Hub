# Registry of model vendors, their models and effort levels.
# Facts here are cached: they are refreshed only by `skillctl vendor refresh`
# followed by `skillctl vendor apply`. No other work in this repository goes to
# a vendor's documentation or edits this file.
# A vendor is a model supplier, not a harness: the `platforms` list in
# skills.yaml (universal, codex, opencode, claude, hermes) is a different axis.
# `in_use: true` marks a vendor the library actually measures against; those are
# the ones `skillctl vendor check` holds to a completed documentation sync.
version: 1
vendors:
  - name: anthropic
    display_name: Anthropic
    in_use: true
    effort_param: output_config.effort
    effort_levels: [low, medium, high, xhigh, max]
    default_effort: high
    effort_env_var: CLAUDE_EFFORT
    docs_models: https://platform.claude.com/docs/en/about-claude/models/overview.md
    docs_effort: https://platform.claude.com/docs/en/build-with-claude/effort.md
    docs_checked_at: 2026-08-05
    docs_checked_by: repo-maintainer
    docs_refresh_required: false
    last_refresh_reason: operator-request
  - name: openai
    display_name: OpenAI
    in_use: false
    effort_param: reasoning.effort
    effort_levels: [none, low, medium, high, xhigh, max]
    default_effort: none
    effort_env_var: null
    docs_models: null
    docs_effort: null
